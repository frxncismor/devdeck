name: Bug report
description: Something in DevDeck does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security problems, do **not** use this form: see the [security policy](https://github.com/frxncismor/devdeck/security/policy).
  - type: input
    id: version
    attributes:
      label: DevDeck version
      description: Shown in the installer name or the release you downloaded, for example 0.1.0.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - Worktrees
        - Ports
        - JSON Viewer
        - Reclaim
        - Other
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: UI language
      options:
        - English
        - Spanish
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant output or drag in screenshots.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets and personal paths from any logs and screenshots.
          required: true
