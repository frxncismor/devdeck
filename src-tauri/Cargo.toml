[package]
name = "devdeck"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DevDeck — a Tauri 2 + Rust desktop dashboard for developers: track git worktrees, see which worktree owns each listening port, browse multi-hundred-MB JSON files, and reclaim disk and RAM from forgotten worktrees, orphaned dev processes and regenerable build folders."

[lib]
name = "devdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
devdeck-core = { version = "0.1.0", path = "../crates/devdeck-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.7"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-store = "2.5.1"

[build-dependencies]
tauri-build = "2.7.6"
